name: Validate public material
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r website/requirements.txt
      - run: python website/format_demo_sources.py --check
      - run: python website/build_book.py
      - run: python website/check_site.py
      - run: python tools/check_public_sources.py
